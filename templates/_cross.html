{# 세 체계 교차 분석 탭 #}
<h2>세 가지로 비교하기</h2>
<p class="lead">사주, 자미두수, 별자리 출생차트가 같은 사람을 두고 무엇을 함께 말하고 무엇을 다르게 말하는지 AI가 비교합니다.</p>
{% if ai_state == 'on' %}
<button type="button" class="btn" id="cross-btn">세 가지로 비교해 보기</button>
<div id="cross-out" hidden>
  <details class="reading" open><summary>함께 가리키는 것</summary><div class="body" data-ai="cross_common" data-group="cross"></div></details>
  <details class="reading" open><summary>서로 다르게 말하는 것</summary><div class="body" data-ai="cross_diff" data-group="cross"></div></details>
  <details class="reading" open><summary>종합 조언</summary><div class="body" data-ai="cross_advice" data-group="cross"></div></details>
</div>
{% elif ai_state == 'limited' %}
<p class="notice">오늘 AI 풀이 제공량을 모두 써서 비교 풀이를 만들 수 없습니다. 각 탭의 계산 결과는 그대로 볼 수 있습니다.</p>
{% else %}
<p class="notice">지금은 AI 풀이를 쓸 수 없습니다.</p>
{% endif %}
