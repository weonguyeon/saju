<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ app_title }}{% endblock %}</title>
  <meta name="description" content="생년월일과 태어난 시간으로 사주 원국, 오행, 십성, 대운을 무료로 계산하고 AI 해석을 함께 보여드립니다.">
  <meta name="color-scheme" content="light dark">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;700&display=swap">
  <link rel="stylesheet" href="{{ asset_url('style.css') }}">
</head>
<body>
  <header class="site-head wrap">
    <a href="{{ url_for('index') }}"><p class="brand">{{ app_title }}<small>만세력 계산과 AI 해석을 한 번에</small></p></a>
  </header>
  <main class="wrap">
    {% block main %}{% endblock %}
  </main>
  <footer class="site-foot wrap">
    <p>사주 해석은 재미와 자기 성찰을 위한 참고 자료입니다. 중요한 결정은 스스로의 판단으로 내려 주세요.</p>
    <p>만든 사람 원구연 · <a href="{{ url_for('licenses') }}">오픈소스 고지</a></p>
  </footer>
  {% block scripts %}{% endblock %}
</body>
</html>
